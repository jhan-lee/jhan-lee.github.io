{% assign post = include.post %}

<li class="achievement-entry"><strong>{{ post.award }}</strong> {{ post.detail }}{% if post.role != blank %} <span class="achievement-entry__role">({{ post.role }})</span>{% endif %}.
{% if post.note != blank %}
<ul class="achievement-entry__note"><li><em>{{ post.note }}</em></li></ul>
{% endif %}
</li>
